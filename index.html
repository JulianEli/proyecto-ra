<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Educativo – Circuito Eléctrico</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      #overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 18px;
        gap: 10px;
      }
      #titulo {
        background: rgba(0,0,0,0.75);
        color: #fff;
        font-family: 'Segoe UI', sans-serif;
        font-size: clamp(13px, 3.5vw, 17px);
        font-weight: 700;
        letter-spacing: 0.07em;
        padding: 10px 24px;
        border-radius: 30px;
        border: 1.5px solid rgba(34,211,238,0.35);
        text-align: center;
        backdrop-filter: blur(8px);
      }
      #instruccion {
        background: rgba(6, 78, 120, 0.85);
        color: #e0f7ff;
        font-family: 'Segoe UI', sans-serif;
        font-size: clamp(11px, 3vw, 14px);
        padding: 8px 20px;
        border-radius: 20px;
        text-align: center;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(34,211,238,0.25);
      }
      #badges {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .badge {
        background: rgba(0,0,0,0.65);
        color: #22d3ee;
        font-family: 'Segoe UI', sans-serif;
        font-size: clamp(10px, 2.5vw, 12px);
        padding: 5px 14px;
        border-radius: 14px;
        border: 1px solid rgba(34,211,238,0.3);
        backdrop-filter: blur(4px);
      }
    </style>
  </head>
  <body>

    <div id="overlay">
      <div id="titulo">⚡ AR Educativo · Circuito Eléctrico</div>
      <div id="instruccion">📷 Apunta la cámara al marcador HIRO impreso</div>
      <div id="badges">
        <span class="badge">Marcador 1 · HIRO → Circuito PCB</span>
      </div>
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; antialias: true;"
      loading-screen="enabled: false">

      <a-assets timeout="20000">
        <a-asset-item id="mi-modelo" src="modelo.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro">

        <a-cylinder
          position="0 0.04 0"
          radius="1.05"
          height="0.08"
          color="#0a1628"
          opacity="0.9">
        </a-cylinder>

        <a-cylinder
          position="0 0.09 0"
          radius="1.05"
          height="0.01"
          color="#22d3ee"
          opacity="0.5">
        </a-cylinder>

        <a-gltf-model
          src="#mi-modelo"
          position="0 0.5 0"
          scale="0.8 0.8 0.8"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear">
        </a-gltf-model>

        <a-entity
          position="0 2.2 0"
          look-at="[camera]">
          <a-text
            value="CIRCUITO ELECTRICO\nUn circuito conduce corriente\nentre fuente, conductor y carga."
            align="center"
            color="#ffffff"
            scale="1.35 1.35 1.35"
            font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
            width="3.6"
            wrap-count="22"
            background="true"
            background-color="#0a1628"
            opacity="1">
          </a-text>
        </a-entity>
 
        <a-entity
          position="0 1.5 0"
          look-at="[camera]"
          animation="property: position; from: 0 1.5 0; to: 0 1.62 0; loop: true; dir: alternate; dur: 1800; easing: easeInOutSine">
          <a-text
            value="Voltaje · Corriente · Resistencia"
            align="center"
            color="#22d3ee"
            scale="0.95 0.95 0.95"
            width="3.4"
            wrap-count="30">
          </a-text>
        </a-entity>

        <a-ring
          position="0 0.1 0"
          radius-inner="0.88"
          radius-outer="0.97"
          rotation="-90 0 0"
          color="#22d3ee"
          opacity="0.45"
          animation="property: rotation; from: -90 0 0; to: -90 360 0; loop: true; dur: 7000; easing: linear">
        </a-ring>

      </a-marker>

      <a-entity camera></a-entity>

    </a-scene>

  </body>
</html>
